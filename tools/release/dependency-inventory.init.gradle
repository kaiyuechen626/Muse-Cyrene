import groovy.json.JsonOutput

gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    app.tasks.register('writeReleaseInventory') {
        doLast {
            def items = app.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult.allComponents.collect { c ->
                [coordinate: c.id.displayName,
                 reasons: c.selectionReason.descriptions.collect { it.description }]
            }.sort { it.coordinate }
            def out = new File(app.buildDir, 'reports/release/release-dependencies.json')
            out.parentFile.mkdirs()
            out.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                configuration: 'releaseRuntimeClasspath',
                scope: 'Resolved dependency graph, not a binary license audit; local AAR and generated native runtime recorded separately',
                licenseClearance: false, artifacts: items])) + '\n'
            println('Recorded ' + items.size() + ' resolved release artifacts')
        }
    }
}
